name: healthcare-copilot

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      MSSQL_PID: Developer
      # Container clock in UTC so CURRENT_TIMESTAMP defaults are UTC.
      TZ: UTC
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  # The mssql image has no docker-entrypoint-initdb.d, so the database, the
  # application login and the SELECT-only agent login are provisioned by this
  # short-lived service. It is idempotent and re-runs harmlessly.
  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    user: root
    environment:
      MSSQL_HOST: mssql
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      MSSQL_DB: ${MSSQL_DB:-copilot}
      MSSQL_APP_USER: ${MSSQL_APP_USER:-copilot_app}
      MSSQL_APP_PASSWORD: ${MSSQL_APP_PASSWORD:?set MSSQL_APP_PASSWORD in .env}
      MSSQL_READONLY_USER: ${MSSQL_READONLY_USER:-copilot_readonly}
      MSSQL_READONLY_PASSWORD: ${MSSQL_READONLY_PASSWORD:?set MSSQL_READONLY_PASSWORD in .env}
    volumes:
      - ./infrastructure/docker/mssql/init:/init:ro
    entrypoint: ["/bin/bash", "/init/entrypoint.sh"]
    depends_on:
      mssql: { condition: service_healthy }
    restart: "no"

  qdrant:
    # Pinned to match qdrant-client's supported range - the client warns and
    # may misbehave when the server's minor version drifts more than one.
    image: qdrant/qdrant:v1.19.1
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: WARN
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The image is distroless - no curl, no shell, no wget - so the only
      # thing that can be executed is Qdrant's own binary.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./services/api
      target: dev
    env_file: [.env]
    environment:
      # Container-internal hostnames override whatever .env points at for host use.
      DATABASE_URL: mssql+aioodbc://${MSSQL_APP_USER:-copilot_app}:${MSSQL_APP_PASSWORD}@mssql:1433/${MSSQL_DB:-copilot}?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
      READONLY_DATABASE_URL: mssql+aioodbc://${MSSQL_READONLY_USER:-copilot_readonly}:${MSSQL_READONLY_PASSWORD}@mssql:1433/${MSSQL_DB:-copilot}?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      # Ollama runs on the host, not in the compose network. Hardcoded rather
      # than ${OLLAMA_BASE_URL:-...} for the same reason as the two above: .env
      # carries the value a developer needs from *their* shell, and the
      # container needs a different one for the same service.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      STORAGE_DIR: /srv/.data/storage
      # Where scripts/generate_synthetic_documents.py writes the corpus.
      CORPUS_DIR: /evaluation/datasets/documents
      # The evaluation question set, experiment sweeps and run reports. All
      # three are committed artefacts, so they resolve to the mounted repo
      # directory rather than to the container's working directory.
      EVAL_DATASET_DIR: /evaluation/datasets/questions
      EVAL_EXPERIMENT_DIR: /evaluation/experiments
      EVAL_REPORT_DIR: /evaluation/reports
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./services/api:/srv
      - api_storage:/srv/.data
      # The generated corpus and evaluation datasets belong in the repo.
      - ./evaluation:/evaluation
    # Docker Desktop provides host.docker.internal; Linux does not, so it is
    # mapped explicitly. CI never connects (LLM_PROVIDER=echo), but a name that
    # resolves everywhere beats one that fails differently per platform.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mssql: { condition: service_healthy }
      mssql-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    # Migrations run on start so a fresh clone is one command away from working.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./apps/web
      target: dev
    env_file: [.env]
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_API_PREFIX: ${NEXT_PUBLIC_API_PREFIX:-/api/v1}
      WATCHPACK_POLLING: "true"
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app
      # Keep the image's node_modules; the host bind mount must not shadow it.
      - /app/node_modules
      - /app/.next
    depends_on:
      api: { condition: service_started }

volumes:
  mssql_data:
  qdrant_data:
  api_storage:
