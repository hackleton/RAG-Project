[project]
name = "healthcare-copilot-api"
version = "0.1.0"
description = "GenAI Healthcare Intelligence Copilot - API service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    # SQL Server over async ODBC. pyodbc ships manylinux wheels, so the
    # image only needs the unixODBC runtime plus Microsoft's driver.
    "aioodbc>=0.5.0",
    "pyodbc>=5.2.0",
    "alembic>=1.14.0",
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.12",
    "structlog>=24.4.0",
    # Document extraction. Both are pure Python with permissive licences -
    # PyMuPDF would give richer layout but is AGPL.
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    # Vector store and local embedding/reranking models. fastembed runs on
    # onnxruntime rather than torch, which keeps the image a tenth of the size.
    "qdrant-client>=1.12.0",
    "fastembed>=0.5.0",
    "httpx>=0.27.2",
    "redis>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2",
    "aiosqlite>=0.20.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
