name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: Install
        working-directory: services/api
        run: pip install -e ".[dev]"

      - name: Lint
        working-directory: services/api
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        working-directory: services/api
        run: mypy app

      - name: Tests
        working-directory: services/api
        run: pytest -q

  migrations:
    name: API — migrations match the models
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: copilot_ci_password
          POSTGRES_DB: copilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U copilot -d copilot"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: ci
      DATABASE_URL: postgresql+asyncpg://copilot:copilot_ci_password@localhost:5432/copilot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: Install
        working-directory: services/api
        run: pip install -e ".[dev]"

      - name: Upgrade, downgrade, upgrade
        working-directory: services/api
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      # The unit suite runs on SQLite and cannot see Postgres-specific drift.
      # This is what keeps the migrations and the ORM metadata honest.
      - name: No drift between migrations and models
        working-directory: services/api
        run: alembic check

      - name: Seed script runs clean
        working-directory: services/api
        env:
          SEED_ADMIN_EMAIL: admin@example.com
          SEED_ADMIN_PASSWORD: ci-admin-password
          SEED_CLINICIAN_EMAIL: clinician@example.com
          SEED_CLINICIAN_PASSWORD: ci-clinician-password
          SEED_ANALYST_EMAIL: analyst@example.com
          SEED_ANALYST_PASSWORD: ci-analyst-password
          BCRYPT_ROUNDS: "4"
        run: |
          python scripts/seed.py
          python scripts/seed.py # must be idempotent

  web:
    name: Web — lint, types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm run build

  compose:
    name: Stack — boots and answers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Boot the stack
        run: |
          cp .env.example .env
          docker compose up -d --build postgres redis api

      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/ready > /dev/null; then
              echo "API ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 3
          done
          echo "API never became ready"
          docker compose logs api
          exit 1

      - name: Seed and check an authenticated round trip
        run: |
          docker compose run --rm api python scripts/seed.py
          TOKEN=$(curl -fsS -X POST http://localhost:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"clinician@example.com","password":"Clinician123!local"}' \
            | python -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          curl -fsS http://localhost:8000/api/v1/auth/me -H "Authorization: Bearer $TOKEN"
          # A clinician must not reach an admin-only endpoint.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://localhost:8000/api/v1/evaluations/run -H "Authorization: Bearer $TOKEN")
          test "$code" = "403" || { echo "expected 403, got $code"; exit 1; }

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
