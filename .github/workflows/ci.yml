name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      # pyodbc links against unixODBC at import time. The unit suite runs on
      # SQLite and never opens an ODBC connection, so the driver itself is not
      # needed here - only the library.
      - name: Install unixODBC
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends unixodbc

      - name: Install
        working-directory: services/api
        run: pip install -e ".[dev]"

      - name: Lint
        working-directory: services/api
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        working-directory: services/api
        run: mypy app

      - name: Tests
        working-directory: services/api
        run: pytest -q

  # Everything that needs a real SQL Server runs through the same compose file
  # developers use, rather than a second stack defined only in CI.
  stack:
    name: Stack — SQL Server, migrations, boot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Boot SQL Server and the API
        run: |
          cp .env.example .env
          docker compose up -d --build mssql redis qdrant
          docker compose up mssql-init

      - name: Upgrade, downgrade, upgrade
        run: |
          docker compose run --rm api alembic upgrade head
          docker compose run --rm api alembic downgrade base
          docker compose run --rm api alembic upgrade head

      # The unit suite runs on SQLite and cannot see SQL Server-specific drift
      # (NVARCHAR lengths, UNIQUEIDENTIFIER, JSON-as-NVARCHAR(max)).
      - name: No drift between migrations and models
        run: docker compose run --rm api alembic check

      - name: The agent login cannot write
        run: |
          set -e
          ro_sql() {
            docker compose exec -T mssql bash -c \
              "/opt/mssql-tools18/bin/sqlcmd -S localhost -U copilot_readonly \
               -P 'Local_Dev_ReadOnly_Password_1' -d copilot -C -b -Q \"$1\""
          }
          ro_sql "SELECT COUNT(*) FROM users;"
          if ro_sql "DELETE FROM users;"; then
            echo "FAIL: the read-only login was able to delete rows"
            exit 1
          fi
          echo "OK: writes are denied to the agent login"

      - name: Seed is idempotent
        run: |
          docker compose run --rm api python scripts/seed.py
          docker compose run --rm api python scripts/seed.py

      # Generation is seeded, so a change that alters the corpus shows up as a
      # diff rather than as a mysterious evaluation regression later.
      - name: Synthetic corpus is reproducible
        run: |
          docker compose run --rm api python scripts/generate_synthetic_documents.py
          if ! git diff --exit-code evaluation/datasets/documents; then
            echo "The generated corpus changed - commit it, or fix the seed"
            exit 1
          fi

      # EMBEDDING_PROVIDER=hash keeps CI off the model download while still
      # exercising Qdrant, the pre-search filters, fusion and hydration.
      - name: Corpus ingests, indexes, and re-ingesting is a no-op
        run: |
          echo "EMBEDDING_PROVIDER=hash" >> .env
          docker compose run --rm api python scripts/ingest_corpus.py | tee /tmp/first.log
          grep -q "18 document" /tmp/first.log
          grep -q "123 chunk" /tmp/first.log
          docker compose run --rm api python scripts/ingest_corpus.py | tee /tmp/second.log
          grep -q "deduplicated" /tmp/second.log

      - name: The index can be rebuilt from the database
        run: |
          docker compose run --rm api python scripts/reindex.py --all | tee /tmp/reindex.log
          grep -q "123 points in the collection" /tmp/reindex.log

      - name: API boots and answers
        run: |
          docker compose up -d api
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/ready > /dev/null; then
              echo "API ready after ${attempt} attempt(s)"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "API never became ready"
              docker compose logs api
              exit 1
            fi
            sleep 3
          done

      - name: Authenticated round trip
        run: |
          TOKEN=$(curl -fsS -X POST http://localhost:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"clinician@example.com","password":"Clinician123!local"}' \
            | python -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          curl -fsS http://localhost:8000/api/v1/auth/me -H "Authorization: Bearer $TOKEN"
          # A clinician must not reach an admin-only endpoint.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://localhost:8000/api/v1/evaluations/run -H "Authorization: Bearer $TOKEN")
          test "$code" = "403" || { echo "expected 403, got $code"; exit 1; }

      # Asserts that answers are grounded and cited, and that an analyst
      # retrieves nothing at all for an injection-shaped question - the
      # pre-search filter, checked over HTTP against the real stack.
      - name: Retrieval is grounded, cited and scoped
        run: docker compose run --rm api python scripts/smoke_retrieval.py

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

  web:
    name: Web — lint, types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm run build
